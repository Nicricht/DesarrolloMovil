spring.application.name=api-gateway
server.port=8080
services.siniestros-url=${SINIESTROS_BASE_URL:http://localhost:8082}
services.catalogos-url=${CATALOGOS_BASE_URL:http://localhost:8081}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=Siniestros
springdoc.swagger-ui.urls[0].url=/openapi/siniestros
springdoc.swagger-ui.urls[1].name=Catalogos
springdoc.swagger-ui.urls[1].url=/openapi/catalogos
springdoc.swagger-ui.urlsPrimaryName=Siniestros

name: Android Java Integracion
on:
  push:
    branches: [feature/integracion-android-java-retrofit-20261116]
    paths:
      - 'integracion-android/**'
      - 'scripts/preparar_android_integrado.py'
      - 'Proyecto_Seguros_BPO-main (1).zip'
      - 'backend-java/**'
      - '.github/workflows/integracion-android-java.yml'
  pull_request:
    paths:
      - 'integracion-android/**'
      - 'scripts/preparar_android_integrado.py'
      - 'Proyecto_Seguros_BPO-main (1).zip'
      - 'backend-java/**'
      - '.github/workflows/integracion-android-java.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Instalar SDK Android
        shell: bash
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          sdkmanager "platforms;android-37.2"
      - name: Generar proyecto Android a partir de ZIP original
        run: python3 scripts/preparar_android_integrado.py
      - name: Compilar APK y ejecutar JUnit Android
        working-directory: android-integrado
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Publicar APK de integración
        uses: actions/upload-artifact@v4
        with:
          name: seguros-bpo-android-retrofit-debug
          path: android-integrado/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publicar resultados unitarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-android-integrado
          path: android-integrado/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-java/pom.xml
      - name: Pruebas Java Spring Boot
        working-directory: backend-java
        run: mvn -B -ntp clean verify

  comunicacion:
    runs-on: ubuntu-latest
    needs: [android, backend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Levantar microservicios
        working-directory: backend-java
        run: docker compose up --build -d --wait --wait-timeout 210
      - name: Probar gateway y comunicación entre microservicios
        working-directory: backend-java
        run: |
          bash scripts/docker-smoke.sh
          bash scripts/docker-e2e.sh
      - name: Detener microservicios
        if: always()
        working-directory: backend-java
        run: docker compose down --remove-orphans

  emulador-e2e:
    runs-on: ubuntu-latest
    needs: [android, backend]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Instalar SDK Android
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          sdkmanager "platforms;android-37.2"
      - name: Generar aplicación Android integrada
        run: python3 scripts/preparar_android_integrado.py
      - name: Levantar backend para emulador
        working-directory: backend-java
        run: docker compose up --build -d --wait --wait-timeout 210
      - name: Habilitar aceleración KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Verificar petición real desde emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: cd android-integrado && chmod +x gradlew && ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Guardar pruebas instrumentadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seguros-bpo-e2e-emulador
          path: android-integrado/app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14
      - name: Detener backend
        if: always()
        working-directory: backend-java
        run: docker compose down --remove-orphans

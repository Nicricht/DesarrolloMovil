name: Android CI

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK debug
        run: ./gradlew :app:assembleDebug

      - name: Ejecutar pruebas unitarias
        run: ./gradlew :app:testDebugUnitTest

  instrumented-tests:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Empaquetar backend Spring Boot
        run: mvn -B -f backend/pom.xml -DskipTests package

      - name: Iniciar backend Spring Boot
        run: |
          nohup java -jar backend/target/seguimiento-siniestros-backend-0.0.1-SNAPSHOT.jar > backend.log 2>&1 &
          echo $! > backend.pid
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/api/v1/health > /dev/null; then
              echo "Backend listo"
              exit 0
            fi
            sleep 2
          done
          cat backend.log
          exit 1

      - name: Habilitar permisos KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ejecutar pruebas instrumentadas en emulador
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Guardar reportes de pruebas instrumentadas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            backend.log
          if-no-files-found: warn

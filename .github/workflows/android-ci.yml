name: Quality Gate

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "test/**"
      - "docs/**"
  pull_request:
    branches:
      - develop
      - main

jobs:
  fast-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar Fast Gate
        env:
          FIRST_PASS_RISK: MEDIUM
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          bash scripts/ci/fast-gate.sh "$BASE_SHA"

  full-gate:
    needs: fast-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar Full Gate
        env:
          FIRST_PASS_RISK: MEDIUM
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          bash scripts/ci/full-gate.sh "$BASE_SHA"

      - name: Guardar reporte JaCoCo Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-android
          path: app/build/reports/jacoco/
          if-no-files-found: warn

      - name: Guardar reporte JaCoCo backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-backend
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  instrumented-tests:
    needs: full-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Iniciar backend si existe
        run: |
          if [[ -f backend/pom.xml ]]; then
            mvn -B -f backend/pom.xml -DskipTests package
            nohup java -jar backend/target/*.jar > backend.log 2>&1 &
            for i in {1..30}; do
              if curl --fail --silent http://localhost:8080/api/v1/health > /dev/null; then
                echo "Backend listo"
                exit 0
              fi
              sleep 2
            done
            cat backend.log
            exit 1
          fi

      - name: Habilitar permisos KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ejecutar pruebas instrumentadas
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Guardar reportes instrumentados
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            backend.log
          if-no-files-found: warn
